name: Code Plan PR Checks

on:
  push:
    branches:
      - codex/zer-150-plan-module
      - litellm_zer_151_credit_rules
      - litellm_zer_152_153_subscription
      - codex/zer-154-gateway-hooks-mvp
      - codex/zer-155-code-plan-quota-service
    paths:
      - ".github/workflows/code-plan-pr-checks.yml"
      - "backend/routes/allowlist.py"
      - "gateway/**"
      - "litellm/product/plans/**"
      - "litellm/product/credit_rules/**"
      - "litellm/product/subscriptions/**"
      - "litellm/product/quotas/**"
      - "litellm/proxy/hooks/code_plan_quota.py"
      - "litellm/proxy/hooks/__init__.py"
      - "tests/proxy_unit_tests/test_code_plan_gateway.py"
      - "tests/proxy_unit_tests/test_code_plan_plans.py"
      - "tests/proxy_unit_tests/test_code_plan_credit_rules.py"
      - "tests/proxy_unit_tests/test_code_plan_credit_rules_api.py"
      - "tests/proxy_unit_tests/test_code_plan_subscriptions.py"
      - "tests/proxy_unit_tests/test_code_plan_subscriptions_api.py"
      - "tests/proxy_unit_tests/test_code_plan_quotas.py"
      - "tests/proxy_unit_tests/test_code_plan_notion_regressions.py"
      - "tests/proxy_unit_tests/code_plan_api_test_utils.py"
      - "scripts/code_plan_subscription_live_e2e.sh"
      - "schema.prisma"
      - "litellm/proxy/schema.prisma"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - "litellm/proxy/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
  pull_request:
    branches:
      - litellm_internal_staging
      - litellm_zer_152_153_subscription
    paths:
      - ".github/workflows/code-plan-pr-checks.yml"
      - "backend/routes/allowlist.py"
      - "gateway/**"
      - "litellm/product/plans/**"
      - "litellm/product/credit_rules/**"
      - "litellm/product/subscriptions/**"
      - "litellm/product/quotas/**"
      - "litellm/proxy/hooks/code_plan_quota.py"
      - "litellm/proxy/hooks/__init__.py"
      - "tests/proxy_unit_tests/test_code_plan_gateway.py"
      - "tests/proxy_unit_tests/test_code_plan_plans.py"
      - "tests/proxy_unit_tests/test_code_plan_credit_rules.py"
      - "tests/proxy_unit_tests/test_code_plan_credit_rules_api.py"
      - "tests/proxy_unit_tests/test_code_plan_subscriptions.py"
      - "tests/proxy_unit_tests/test_code_plan_subscriptions_api.py"
      - "tests/proxy_unit_tests/test_code_plan_quotas.py"
      - "tests/proxy_unit_tests/test_code_plan_notion_regressions.py"
      - "tests/proxy_unit_tests/code_plan_api_test_utils.py"
      - "scripts/code_plan_subscription_live_e2e.sh"
      - "schema.prisma"
      - "litellm/proxy/schema.prisma"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
      - "litellm/proxy/migrations/**"
      - "litellm-proxy-extras/litellm_proxy_extras/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-plan:
    name: pytest, ruff, prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/litellm
      CODE_PLAN_API_INTEGRATION: "true"
      CODE_PLAN_REDIS_INTEGRATION: "true"
      CODE_PLAN_QUOTA_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: litellm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: make install-test-deps

      - name: Push Prisma schema to Postgres
        run: .venv/bin/prisma db push --schema litellm/proxy/schema.prisma --accept-data-loss --skip-generate

      - name: Run Code Plan unit pytest
        run: .venv/bin/pytest tests/proxy_unit_tests/test_code_plan_gateway.py tests/proxy_unit_tests/test_code_plan_plans.py tests/proxy_unit_tests/test_code_plan_credit_rules.py tests/proxy_unit_tests/test_code_plan_subscriptions.py tests/proxy_unit_tests/test_code_plan_quotas.py tests/proxy_unit_tests/test_code_plan_notion_regressions.py -q

      - name: Run Code Plan API integration pytest
        run: .venv/bin/pytest tests/proxy_unit_tests/test_code_plan_credit_rules_api.py tests/proxy_unit_tests/test_code_plan_subscriptions_api.py -q

      - name: Run Code Plan ruff
        run: .venv/bin/ruff check gateway litellm/product/plans litellm/product/credit_rules litellm/product/subscriptions litellm/product/quotas litellm/proxy/hooks/code_plan_quota.py tests/proxy_unit_tests/test_code_plan_gateway.py tests/proxy_unit_tests/test_code_plan_plans.py tests/proxy_unit_tests/test_code_plan_credit_rules.py tests/proxy_unit_tests/test_code_plan_credit_rules_api.py tests/proxy_unit_tests/test_code_plan_subscriptions.py tests/proxy_unit_tests/test_code_plan_subscriptions_api.py tests/proxy_unit_tests/test_code_plan_quotas.py tests/proxy_unit_tests/test_code_plan_notion_regressions.py tests/proxy_unit_tests/code_plan_api_test_utils.py

      - name: Validate proxy Prisma schema
        run: .venv/bin/prisma validate --schema litellm/proxy/schema.prisma

      - name: Validate extras Prisma schema
        run: .venv/bin/prisma validate --schema litellm-proxy-extras/litellm_proxy_extras/schema.prisma
