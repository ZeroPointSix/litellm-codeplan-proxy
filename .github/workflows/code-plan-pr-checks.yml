name: Code Plan PR Checks

on:
  push:
    branches:
      - codex/zer-150-plan-module
    paths:
      - ".github/workflows/code-plan-pr-checks.yml"
      - "litellm/product/plans/**"
      - "tests/proxy_unit_tests/test_code_plan_plans.py"
      - "schema.prisma"
      - "litellm/proxy/schema.prisma"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
  pull_request:
    branches:
      - litellm_internal_staging
    paths:
      - ".github/workflows/code-plan-pr-checks.yml"
      - "litellm/product/plans/**"
      - "tests/proxy_unit_tests/test_code_plan_plans.py"
      - "schema.prisma"
      - "litellm/proxy/schema.prisma"
      - "litellm-proxy-extras/litellm_proxy_extras/schema.prisma"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-plan:
    name: pytest, ruff, prisma validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: make install-test-deps

      - name: Run Plan pytest
        run: .venv/bin/pytest tests/proxy_unit_tests/test_code_plan_plans.py -q

      - name: Run Plan ruff
        run: .venv/bin/ruff check litellm/product/plans tests/proxy_unit_tests/test_code_plan_plans.py

      - name: Validate proxy Prisma schema
        run: .venv/bin/prisma validate --schema litellm/proxy/schema.prisma

      - name: Validate extras Prisma schema
        run: .venv/bin/prisma validate --schema litellm-proxy-extras/litellm_proxy_extras/schema.prisma
